# Publishes Tiny Wins to GitHub Pages. Put the contents of this folder at the root of a repo,
# then in Settings > Pages choose "GitHub Actions" as the source. See HOSTING.md.
name: Deploy Tiny Wins to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir _site
          cp -r index.html style.css app.js sounds.js sw.js manifest.json icon.svg icon-*.png apple-touch-icon.png favicon-*.png screenshots sounds NOTICE.txt LICENSE.txt _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
